name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "server-auth/**"
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify board permissions and security
        run: node --test server-auth/board-permissions.test.mjs server-auth/security-regression.test.mjs

      - name: Write Worker config
        working-directory: server-auth
        run: |
          cat > wrangler.toml <<'EOF'
          name = "coin-board-auth"
          main = "cloudflare-worker.js"
          compatibility_date = "2026-06-12"

          [vars]
          FRONTEND_ORIGIN = "https://fnfnfn3232.github.io"
          NEWS_LIMIT = "40"
          NEWS_STORE_LIMIT = "1000"
          NEWS_CACHE_SECONDS = "600"
          MEMBER_REGISTRATION_ENABLED = "true"

          [triggers]
          crons = ["17 18 * * *"]

          [[durable_objects.bindings]]
          name = "BOARD_STORE"
          class_name = "BoardStore"

          [[r2_buckets]]
          binding = "BOARD_MEDIA_BUCKET"
          bucket_name = "coin-board-media"

          [[r2_buckets]]
          binding = "BACKUP_BUCKET"
          bucket_name = "coin-site-backups"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["BoardStore"]
          EOF

      - name: Ensure private R2 buckets
        working-directory: server-auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 r2 bucket create coin-board-media || true
          npx --yes wrangler@3 r2 bucket create coin-site-backups || true

      - name: Protect backup objects from deletion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/coin-site-backups/lock"
          current="$(curl --fail-with-body --silent --show-error "$api_url" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          echo "$current" | jq -e '.success == true' >/dev/null

          rules="$(echo "$current" | jq '
            (.result.rules // [])
            | map(select(.id != "protect-database-30d"
              and .id != "protect-media-30d"
              and .id != "protect-legacy-media-30d"))
            + [
                {
                  id: "protect-database-30d",
                  enabled: true,
                  prefix: "database/",
                  condition: { type: "Age", maxAgeSeconds: 2592000 }
                },
                {
                  id: "protect-media-30d",
                  enabled: true,
                  prefix: "media/",
                  condition: { type: "Age", maxAgeSeconds: 2592000 }
                },
                {
                  id: "protect-legacy-media-30d",
                  enabled: true,
                  prefix: "legacy-media/",
                  condition: { type: "Age", maxAgeSeconds: 2592000 }
                }
              ]')"
          payload="$(jq -n --argjson rules "$rules" '{rules: $rules}')"
          updated="$(curl --fail-with-body --silent --show-error -X PUT "$api_url" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")"
          echo "$updated" | jq -e '.success == true' >/dev/null

          verified="$(curl --fail-with-body --silent --show-error "$api_url" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          for rule_id in protect-database-30d protect-media-30d protect-legacy-media-30d; do
            echo "$verified" | jq -e --arg id "$rule_id" \
              '.success == true and any(.result.rules[]; .id == $id and .enabled == true and .condition.type == "Age" and .condition.maxAgeSeconds == 2592000)' \
              >/dev/null
          done
          echo "Verified 30-day deletion protection for database and attachment backups."

      - name: Configure optional email login secrets
        working-directory: server-auth
        # Primary and optional secondary email secrets are synchronized before deployment.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_API_KEY_2: ${{ secrets.RESEND_API_KEY_2 }}
          OTP_EMAIL_TO: ${{ secrets.OTP_EMAIL_TO }}
          OTP_EMAIL_TO_2: ${{ secrets.OTP_EMAIL_TO_2 }}
          OTP_EMAIL_FROM: ${{ secrets.OTP_EMAIL_FROM }}
        run: |
          if [ -n "$RESEND_API_KEY" ] && [ -n "$OTP_EMAIL_TO" ]; then
            printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@3 secret put RESEND_API_KEY
            printf '%s' "$OTP_EMAIL_TO" | npx --yes wrangler@3 secret put OTP_EMAIL_TO
            if [ -n "$RESEND_API_KEY_2" ]; then
              printf '%s' "$RESEND_API_KEY_2" | npx --yes wrangler@3 secret put RESEND_API_KEY_2
            fi
            if [ -n "$OTP_EMAIL_TO_2" ]; then
              printf '%s' "$OTP_EMAIL_TO_2" | npx --yes wrangler@3 secret put OTP_EMAIL_TO_2
            fi
            if [ -n "$OTP_EMAIL_FROM" ]; then
              printf '%s' "$OTP_EMAIL_FROM" | npx --yes wrangler@3 secret put OTP_EMAIL_FROM
            fi
          else
            echo "Email login secrets are not configured; password login remains enabled."
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server-auth
          secrets: |
            SITE_PASSWORD_SHA256
            SESSION_SECRET
        env:
          SITE_PASSWORD_SHA256: ${{ secrets.SITE_PASSWORD_SHA256 }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Probe actual production quote sources
        run: node .github/scripts/probe-comparison.mjs
