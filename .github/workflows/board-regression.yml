name: Board Regression Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app-update.js"
      - "test_app_update.cjs"
      - "test_resource_search.cjs"
      - "test_content_cache.cjs"
      - "test_market_fixture.cjs"
      - "test_futures_health.mjs"
      - ".github/scripts/futures-health.mjs"
      - "comparison-identity.js"
      - "comparison-identity.test.cjs"
      - "test_board_*.cjs"
      - "test_price_difference.cjs"
      - "test_comparison_health.cjs"
      - ".github/scripts/comparison-health.cjs"
      - "server-auth/**"
      - ".github/workflows/board-regression.yml"
  pull_request:
    paths:
      - "index.html"
      - "app-update.js"
      - "test_app_update.cjs"
      - "test_resource_search.cjs"
      - "test_content_cache.cjs"
      - "test_market_fixture.cjs"
      - "test_futures_health.mjs"
      - ".github/scripts/futures-health.mjs"
      - "comparison-identity.js"
      - "comparison-identity.test.cjs"
      - "test_board_*.cjs"
      - "test_price_difference.cjs"
      - "test_comparison_health.cjs"
      - ".github/scripts/comparison-health.cjs"
      - "server-auth/**"
      - ".github/workflows/board-regression.yml"

permissions:
  contents: read

concurrency:
  group: board-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify permissions, sessions and uploads
        run: node --test test_app_update.cjs test_futures_health.mjs test_comparison_health.cjs comparison-identity.test.cjs server-auth/board-permissions.test.mjs server-auth/security-regression.test.mjs
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify board editor and workflows with mocked API responses
        run: |
          node test_board_paste.cjs
          node test_board_workflows.cjs
          node test_board_links.cjs
          node test_board_upload.cjs
          node test_price_difference.cjs
          node test_resource_search.cjs
          node test_content_cache.cjs
